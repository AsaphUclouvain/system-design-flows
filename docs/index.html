<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive system design flows: step through real architectures and see each component, payload, failure mode and the code behind it.">
<meta name="theme-color" content="#f7f5f0">
<title>System Design Flows</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --panel2:#fbfaf7; --ink:#1d1c1a; --ink2:#3d3b37; --muted:#77736b; --rule:#e6e2d9; --rule2:#d8d3c7;
  --code-bg:#f3f1ea; --code-ink:#2a2925; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --accent:#e0911a; --accent-ink:#8a5200;
  --k-client:#2f6fde; --k-edge:#7c5cd6; --k-service:#0f8f84; --k-worker:#3f9b4f; --k-db:#c98a12; --k-cache:#d9453b; --k-queue:#e07b24; --k-storage:#9a6b3f; --k-external:#c2477f;
  --add-bg:rgba(63,155,79,.13); --add-ink:#2c7a3b; --chg-bg:rgba(224,145,26,.15); --chg-ink:#9a5d00; --del-ink:#b4443b;
  --serif:"Iowan Old Style","Charter","Source Serif Pro",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#151513; --panel:#1e1d1b; --panel2:#232220; --ink:#efece6; --ink2:#d6d2ca; --muted:#9c978d; --rule:#2f2d29; --rule2:#3b3934;
  --code-bg:#191816; --code-ink:#e6e2da; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --accent:#f0a53a; --accent-ink:#f6c37a;
  --k-client:#6c9cf0; --k-edge:#a68cf0; --k-service:#3cc0b3; --k-worker:#6cc47b; --k-db:#e6ad3c; --k-cache:#f07a70; --k-queue:#f29a50; --k-storage:#c99a6c; --k-external:#e57aaa;
  --add-bg:rgba(108,196,123,.16); --add-ink:#8fdc9c; --chg-bg:rgba(240,165,58,.17); --chg-ink:#f6c37a; --del-ink:#f0897f;
}}
:root[data-theme=dark]{
  --bg:#151513; --panel:#1e1d1b; --panel2:#232220; --ink:#efece6; --ink2:#d6d2ca; --muted:#9c978d; --rule:#2f2d29; --rule2:#3b3934;
  --code-bg:#191816; --code-ink:#e6e2da; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --accent:#f0a53a; --accent-ink:#f6c37a;
  --k-client:#6c9cf0; --k-edge:#a68cf0; --k-service:#3cc0b3; --k-worker:#6cc47b; --k-db:#e6ad3c; --k-cache:#f07a70; --k-queue:#f29a50; --k-storage:#c99a6c; --k-external:#e57aaa;
  --add-bg:rgba(108,196,123,.16); --add-ink:#8fdc9c; --chg-bg:rgba(240,165,58,.17); --chg-ink:#f6c37a; --del-ink:#f0897f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.sd-top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.sd-top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.sd-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:650;letter-spacing:-.01em}
.sd-logo{width:28px;height:28px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.sd-logo i{border-radius:4px}
.sd-logo i:nth-child(1){background:var(--k-client)}.sd-logo i:nth-child(2){background:var(--k-service)}.sd-logo i:nth-child(3){background:var(--k-queue)}.sd-logo i:nth-child(4){background:var(--k-db)}
.sd-nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.sd-nav a,.sd-iconbtn{text-decoration:none;font-size:14px;color:var(--ink2);padding:7px 10px;border-radius:9px;border:0;background:none;cursor:pointer}
.sd-nav a:hover,.sd-iconbtn:hover{background:var(--panel)}
.sd-nav a.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sd-progressbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .25s}

.sd-main{max-width:1240px;margin:0 auto;padding:22px 18px 120px}

/* home */
.sd-hero{padding:26px 0 12px;max-width:760px}
.sd-eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sd-hero h1{font:600 clamp(32px,6vw,52px)/1.05 var(--serif);letter-spacing:-.02em;margin:12px 0 14px}
.sd-hero p{font-size:18px;color:var(--ink2);margin:0}
.sd-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:18px 0 0;font-size:13px;color:var(--muted)}
.sd-legend span{display:inline-flex;align-items:center;gap:6px}
.sd-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sd-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 8px;position:sticky;top:53px;z-index:5;background:var(--bg);padding:10px 0}
.sd-search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.sd-search input{flex:1;border:0;background:none;outline:none;font:inherit;color:var(--ink);padding:11px 0}
.sd-search svg{color:var(--muted);flex:none}
.sd-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
.sd-chips::-webkit-scrollbar{display:none}
.sd-chip{flex:none;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.sd-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sd-count{font:12px var(--mono);color:var(--muted)}
.sd-cat{margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
.sd-cat h2{font:600 22px/1.2 var(--serif);margin:0}
.sd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sd-card{position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .15s}
.sd-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(40,30,10,.08),0 12px 26px rgba(40,30,10,.10)}
.sd-thumb{height:112px;background:var(--panel2);border-bottom:1px solid var(--rule);position:relative}
.sd-thumb svg{width:100%;height:100%;display:block}
.sd-card-b{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.sd-card h3{margin:0;font:600 18px/1.25 var(--serif);letter-spacing:-.01em}
.sd-card p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
.sd-meta{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:12px var(--mono);color:var(--muted)}
.sd-tag{border:1px solid var(--rule);border-radius:6px;padding:1px 6px;background:var(--panel2)}
.sd-done{position:absolute;top:10px;right:10px;font:600 11px var(--mono);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:3px 8px;color:var(--ink2)}
.sd-empty{padding:40px 0;color:var(--muted)}

/* flow page */
.sd-crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sd-crumb a{text-decoration:none}.sd-crumb a:hover{color:var(--ink)}
.sd-fhead{margin:10px 0 18px;max-width:860px}
.sd-fhead h1{font:600 clamp(28px,5vw,42px)/1.08 var(--serif);letter-spacing:-.02em;margin:6px 0 10px}
.sd-fhead p{margin:0;color:var(--ink2);font-size:17px}
.sd-fmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font:12px var(--mono);color:var(--muted)}
.sd-jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px;padding:2px}
.sd-jump::-webkit-scrollbar{display:none}
.sd-jump a{flex:none;font-size:13px;text-decoration:none;border:1px solid var(--rule);background:var(--panel);padding:6px 11px;border-radius:999px;color:var(--ink2)}
.sd-jump a:hover{border-color:var(--rule2);color:var(--ink)}

.sd-sim{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.sd-stage{position:sticky;top:66px;display:flex;flex-direction:column;gap:12px}
.sd-box{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.sd-diagram{position:relative;margin:0;padding:14px;overflow:hidden;background:
  radial-gradient(circle,var(--rule2) 1px,transparent 1.2px) 0 0/18px 18px,var(--panel2);border-radius:var(--r) var(--r) 0 0}
.sd-canvas{position:relative;width:100%}
.sd-wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sd-wire{fill:none;stroke:var(--rule2);stroke-width:1.6}
.sd-wire.past{stroke:color-mix(in srgb,var(--muted) 70%,transparent);stroke-width:1.8}
.sd-wire.active{stroke-width:2.6}
.sd-wire.async{stroke-dasharray:6 5}
.sd-wire.reply{stroke-dasharray:2 4;stroke-linecap:round}
.sd-wire.active.async,.sd-wire.active.reply{animation:sd-dash 1s linear infinite}
@keyframes sd-dash{to{stroke-dashoffset:-22}}
.sd-packet{filter:drop-shadow(0 0 6px currentColor)}
.sd-wlabel{position:absolute;transform:translate(-50%,-50%);font:600 11px/1.2 var(--mono);background:var(--panel);border:1.5px solid currentColor;border-radius:8px;padding:3px 7px;white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow);pointer-events:none;z-index:4}
.sd-wlabel.badge{padding:0;border:0;background:none;box-shadow:none}
.sd-wlabel.badge b{margin:0;width:20px;height:20px;line-height:20px;font-size:11px;box-shadow:0 0 0 3px var(--panel2)}
.sd-wlabel b{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;text-align:center;color:#fff;background:currentColor;margin-right:5px;font-size:10px}
.sd-wlabel b span{color:#fff}
.sd-node{position:absolute;transform:translate(-50%,-50%);width:var(--nw,128px);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:9px 6px 8px;border-radius:13px;background:var(--panel);border:1.5px solid var(--rule2);box-shadow:var(--shadow);cursor:pointer;z-index:2;transition:border-color .2s,box-shadow .2s,opacity .2s,transform .2s}
.sd-node .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--kc)}
.sd-node .ic svg{width:18px;height:18px}
.sd-node .tx{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center}
.sd-node b{font-size:12.5px;line-height:1.15;font-weight:650;overflow-wrap:anywhere}
.sd-node small{font:10px/1.2 var(--mono);color:var(--muted);margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-node.dim{opacity:.55}
.sd-node.src,.sd-node.dst{opacity:1;border-color:var(--kc);box-shadow:0 0 0 4px color-mix(in srgb,var(--kc) 18%,transparent),var(--shadow)}
.sd-node.dst{transform:translate(-50%,-50%) scale(1.04)}
.sd-node.busy::after{content:"";position:absolute;inset:-7px;border-radius:16px;border:2px solid var(--kc);opacity:.0;animation:sd-ping 1.4s ease-out infinite}
@keyframes sd-ping{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.08)}}
.sd-node.hl{border-color:var(--kc)}
.sd-busychip{position:absolute;transform:translate(-50%,0);font:600 11px var(--mono);background:var(--panel);border:1.5px solid currentColor;border-radius:8px;padding:3px 7px;white-space:nowrap;z-index:4;box-shadow:var(--shadow);pointer-events:none}

.sd-caption{padding:13px 16px 4px;min-height:74px}
.sd-caption .sn{font:600 12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sd-caption h2{font:600 20px/1.25 var(--serif);margin:5px 0 4px;letter-spacing:-.01em}
.sd-caption p{margin:0;color:var(--ink2);font-size:15px}
.sd-ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--rule);margin-top:10px;flex-wrap:wrap}
.sd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule2);background:var(--panel);cursor:pointer;font-size:14px;font-weight:550}
.sd-btn:hover{background:var(--panel2)}
.sd-btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sd-btn:disabled{opacity:.4;cursor:default}
.sd-btn svg{width:16px;height:16px}
.sd-speed{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted);margin-left:auto}
.sd-speed input{width:84px;accent-color:var(--accent)}
.sd-dots{display:flex;gap:4px;flex-wrap:wrap;padding:0 16px 14px}
.sd-dot{width:22px;height:22px;border-radius:7px;border:1px solid var(--rule2);background:var(--panel);font:600 10px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.sd-dot.seen{background:var(--panel2);color:var(--ink2)}
.sd-dot.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sd-ninfo{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--rule2);font-size:14px;color:var(--ink2);display:none}
.sd-ninfo.show{display:block}
.sd-ninfo b{color:var(--ink)}
.sd-ninfo .lk{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sd-legend2{display:flex;gap:12px;flex-wrap:wrap;padding:0 16px 12px;font:11px var(--mono);color:var(--muted)}
.sd-legend2 span{display:inline-flex;gap:6px;align-items:center}
.sd-legend2 svg{width:28px;height:8px}

/* detail panel */
.sd-panel{min-width:0}
.sd-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;position:sticky;top:53px;background:var(--panel);z-index:3;border-radius:var(--r) var(--r) 0 0}
.sd-tabs::-webkit-scrollbar{display:none}
.sd-tab{flex:none;border:0;background:none;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:550;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.sd-tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.sd-tab .ct{font:11px var(--mono);color:var(--muted)}
.sd-tabbody{padding:16px 18px 20px}
.sd-tabbody h3{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.sd-tabbody h3:first-child{margin-top:2px}
.sd-tabbody p{margin:0 0 10px}
.sd-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.sd-list li{position:relative;padding-left:18px;color:var(--ink2)}
.sd-list li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--rule2)}
.sd-fields{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:14.5px}
.sd-fields dt{font:600 12.5px/1.5 var(--mono);color:var(--ink);background:var(--code-bg);border:1px solid var(--rule);padding:1px 7px;border-radius:6px;align-self:start;max-width:46vw;overflow-wrap:anywhere}
.sd-fields dd{margin:0;color:var(--ink2)}
.sd-note{font-size:13px;color:var(--muted);margin-top:10px}
.sd-fail{border-left:3px solid var(--k-cache);background:color-mix(in srgb,var(--k-cache) 7%,var(--panel));padding:12px 14px;border-radius:0 10px 10px 0;color:var(--ink2)}
.sd-fail p:last-child{margin:0}

/* inline references */
.sd-n{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer;border:0;background:none;padding:0}
.sd-n i{width:9px;height:9px;border-radius:3px;background:var(--kc);display:inline-block}
.sd-term{border:0;background:none;padding:0;cursor:help;color:inherit;font:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
.sd-tabbody code,.sd-caption code,.sd-dd code,.sd-prose code{font-size:.86em;background:var(--code-bg);border:1px solid var(--rule);padding:1px 5px;border-radius:5px}

/* payload */
.sd-plhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sd-plkind{font:600 12px var(--mono);padding:3px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--rule)}
.sd-diffkey{display:flex;gap:10px;font:11.5px var(--mono);color:var(--muted);margin-left:auto}
.sd-diffkey span{display:inline-flex;gap:4px;align-items:center}
.sd-diffkey i{font-style:normal;font-weight:700;width:14px;height:14px;line-height:14px;text-align:center;border-radius:4px}
.sd-json,.sd-code{margin:0;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--rule);border-radius:12px;padding:12px 0;overflow:auto;font:12.5px/1.6 var(--mono);tab-size:2;max-height:560px}
.sd-json .ln,.sd-code .ln{display:block;padding:0 14px 0 30px;position:relative;white-space:pre;min-width:max-content}
.sd-json .ln>i{position:absolute;left:10px;font-style:normal;font-weight:700}
.sd-json .add{background:var(--add-bg)}.sd-json .add>i{color:var(--add-ink)}
.sd-json .chg{background:var(--chg-bg)}.sd-json .chg>i{color:var(--chg-ink)}
.sd-json .k{color:var(--k-edge)}.sd-json .s{color:var(--k-service)}.sd-json .n{color:var(--k-queue)}.sd-json .b{color:var(--k-cache)}
.sd-json .ln.fx{cursor:help}
.sd-json .ln.fx .k{text-decoration:underline dotted;text-underline-offset:3px}
.sd-removed{font:12px var(--mono);color:var(--del-ink);margin-top:8px}
.sd-removed s{opacity:.85}

/* code */
.sd-codehead{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.sd-lang{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;color:#fff;background:var(--k-service)}
.sd-lang.python{background:#3a6ea5}.sd-lang.ts,.sd-lang.tsx{background:#2f6fde}.sd-lang.sql{background:#c98a12}.sd-lang.redis{background:#d9453b}.sd-lang.http{background:#7c5cd6}.sd-lang.bash,.sd-lang.yaml{background:#5f6b66}.sd-lang.json{background:#0f8f84}
.sd-codetitle{font-weight:600;font-size:14px}
.sd-copy{margin-left:auto;font:12px var(--mono);border:1px solid var(--rule2);background:var(--panel);border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--ink2)}
.sd-code{padding:12px 14px}
.sd-code .ln{padding:0;white-space:pre}
.sd-code .c{color:var(--muted);font-style:italic}.sd-code .s{color:var(--k-service)}.sd-code .kw{color:var(--k-edge);font-weight:600}.sd-code .nu{color:var(--k-queue)}.sd-code .de{color:var(--k-cache)}.sd-code .fn{color:var(--k-client)}
.sd-codeblock+.sd-codeblock{margin-top:18px}
.sd-illus{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* sections below */
.sd-sec{margin-top:34px;scroll-margin-top:70px}
.sd-sec>h2{font:600 26px/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
.sd-sec>.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.sd-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sd-pad{padding:16px 18px}
.sd-pad h3{margin:0 0 10px;font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sd-est{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sd-est .sd-box{padding:14px 16px}
.sd-est b{display:block;font:600 22px/1.2 var(--serif)}
.sd-est span{display:block;font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sd-est p{margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.sd-api{display:flex;flex-direction:column;gap:8px}

<div class="sd-eyebrow">Edit &amp; host</div>
<h1>Change a flow, add a flow, put it online</h1>
<p>Everything is one HTML file with no build step and no server. The flows are plain data near the top of the <code>&lt;script&gt;</code> section, one <code>flow({ ... })</code> call per flow, so when a technology or a best practice changes you edit text, not code.</p>

<h2>Where things are</h2>
<ul>
<li><b>Flows:</b> search the file for <code>flow({</code>. Each call is one flow. Their order in the file is their order on the home page within a category.</li>
<li><b>Glossary:</b> search for <code>terms({</code>. Add <code>'term': 'plain explanation'</code> and every <code>{{term}}</code> in any flow becomes a tappable definition.</li>
<li><b>Engine:</b> the last script block ("the app engine"). You don't need to touch it to add content.</li>
</ul>

<h2>Add a flow in five minutes</h2>
<ol>
<li>Copy the smallest existing <code>flow({ ... })</code> block and paste it below the others.</li>
<li>Give it a new <code>id</code> (letters and dashes; it becomes the link <code>#/flow/your-id</code>).</li>
<li>List the <code>nodes</code> and place each on the <code>grid</code> with <code>x</code> (column) and <code>y</code> (row), counting from 0. On phones, wide grids are turned on their side automatically.</li>
<li>Write the <code>steps</code> in order. Each step moves from one node to another (or stays on one node for internal work).</li>
<li>Open the file in a browser and step through it. If a node id is misspelled, that step's arrow won't draw.</li>
</ol>

<h2>The shape of a flow</h2>
<pre><code data-lang="ts">flow({
  id: 'url-shortener',                 // unique, used in the link
  title: 'URL shortener',
  category: 'Product systems',         // one of the home page groups
  tags: ['Base62', 'Redis', 'PostgreSQL'],
  summary: 'One sentence shown on the card and the flow header.',
  requirements: { functional: ['...'], nonFunctional: ['...'] },
  estimates: [{ label: 'Writes', value: '1,200 / s', note: 'how you got there' }],
  grid: { cols: 4, rows: 2 },
  nodes: [
    { id: 'app', label: 'Next.js app', sub: 'browser', kind: 'client', x: 0, y: 0,
      desc: 'What this component is for.' },
    // kind: client | edge | service | worker | db | cache | queue | storage | external
    // optional icon: phone lb cdn mail bell clock lock card map chart search user spider dns video
  ],
  steps: [
    { from: 'app', to: 'api', label: 'POST /v1/links',     // short arrow label
      title: 'Heading for the step',
      caption: 'One or two sentences under the diagram.',
      text: ['Longer explanation, one string per paragraph.'],
      details: ['Bullet points for the internals.'],
      payload: { method: 'POST', body: { long_url: 'https://...' } }, // object = JSON with automatic diff, string = raw
      payloadKind: 'HTTP request',      // label above the payload
      payloadLang: 'http',              // only for string payloads: http sql redis bash text
      fields: { 'body.long_url': 'What this field means' },
      failure: ['What breaks here and what the system does about it.'],
      code: [{ lang: 'python', title: 'FastAPI endpoint', src: String.raw`...` }],
      async: true,                      // dashed arrow: goes through a queue
      reply: true                       // dotted arrow: a response
    }
  ],
  api: [{ verb: 'POST', path: '/v1/links', desc: '...' }],
  schema: String.raw`CREATE TABLE ...`,
  decisions: [{ q: 'A question an interviewer asks', options: [
    { verdict: 'bad', name: 'Option', why: '...' },
    { verdict: 'good', name: 'Option', why: '...' },
    { verdict: 'great', name: 'Option', why: '...' } ] }],
  refs: [{ label: 'Source title', url: 'https://...', note: 'why it is worth reading' }]
});</code></pre>

<h2>Markup inside any text</h2>
<ul>
<li><code>`code`</code> for inline code.</li>
<li><code>**bold**</code> for emphasis.</li>
<li><code>[[nodeId]]</code> draws a coloured chip for a component of the same flow; tapping it highlights that component.</li>
<li><code>{{term}}</code> or <code>{{term|shown words}}</code> links to the glossary.</li>
</ul>
<p>Code samples sit inside <code>String.raw`...`</code>, so the one thing they cannot contain is a backtick. In TypeScript samples, build strings with <code>+</code> instead of template literals.</p>

<h2>Put it online as a static site</h2>
<p>The file needs no server code, so any static host works. Rename it to <code>index.html</code> first.</p>
<ul>
<li><b>GitHub Pages:</b> create a repository, add <code>index.html</code>, then Settings, Pages, deploy from the main branch. The site appears at <code>https://&lt;user&gt;.github.io/&lt;repo&gt;/</code>.</li>
<li><b>Netlify Drop:</b> drag a folder holding <code>index.html</code> onto app.netlify.com/drop.</li>
<li><b>Cloudflare Pages or Vercel:</b> connect the repository; there is no build command and the output folder is the root.</li>
<li><b>Inside your Next.js app:</b> put the file in <code>public/flows/index.html</code> and it is served at <code>/flows/index.html</code>.</li>
</ul>
<p>Your progress (which steps you've seen) is kept in your own browser, so it stays on each device.</p>

<script>
/* =====================================================================
   FLOW DATA
   Every flow is one flow({...}) call. Add a flow by copying an existing
   one and changing it; the app picks it up automatically.
   The full field reference is on the "Edit & host" page of the app.
   ===================================================================== */
window.SD_FLOWS = [];
window.SD_GLOSSARY = {};
function flow(f) { window.SD_FLOWS.push(f); }
function terms(o) { Object.keys(o).forEach(function (k) { window.SD_GLOSSARY[k.toLowerCase()] = o[k]; }); }

terms({
  'idempotency': 'Doing the same operation twice has the same effect as doing it once. Essential wherever retries happen, which is everywhere in a distributed system.',
  'idempotency key': 'A unique id the client attaches to a request (usually a UUID). The server remembers the key with its result, so a retry with the same key returns the stored result instead of acting again.',
  'at-least-once': 'A delivery guarantee: every message is delivered one or more times. Nothing is lost, but duplicates are possible, so consumers must be idempotent.',
  'at-most-once': 'A delivery guarantee: every message is delivered zero or one time. No duplicates, but messages can be lost.',
  'exactly-once': 'Each message takes effect exactly one time. Achievable inside one system (Kafka transactions, a database), but end to end across networks it is built from at-least-once delivery plus idempotent processing.',
  'outbox pattern': 'Write the business change and the event that announces it in the same database transaction (the event goes into an "outbox" table). A separate relay publishes outbox rows to the message broker. It removes the dual-write problem.',
  'dual write': 'Updating two systems (say a database and a message broker) without a transaction spanning both. A crash between the two writes leaves them inconsistent.',
  'cdc': 'Change data capture: reading a database\'s change log (PostgreSQL\'s write-ahead log, MySQL\'s binlog) and turning every committed change into an event. Debezium is a common tool.',
  'consumer group': 'A set of consumers that share the work of reading a topic. Each partition is read by exactly one member of the group at a time; different groups read the same data independently.',
  'offset': 'A message\'s position inside a Kafka partition. A consumer group stores the offset it has finished, so after a restart it continues from there.',
  'partition': 'A slice of a topic or table. Kafka topics are split into partitions to spread load; order is guaranteed only inside one partition.',
  'consumer lag': 'How far a consumer group is behind the newest message in a partition. Growing lag means consumers cannot keep up.',
  'dead-letter queue': 'A side queue where messages go after failing too many times, so they stop blocking the main queue and can be inspected or replayed later. Often shortened to DLQ.',
  'exponential backoff': 'Waiting longer after each failed retry: for example 1 s, 2 s, 4 s, 8 s, up to a cap. It gives a struggling service room to recover.',
  'jitter': 'Randomness added to retry delays so that thousands of clients that failed at the same moment don\'t all retry at the same moment too.',
  'cache-aside': 'The application reads the cache first; on a miss it reads the database and fills the cache. On a write it updates the database and deletes the cache entry. Also called lazy loading.',
  'write-through': 'Every write goes to the cache and the database together, so the cache is always fresh, at the cost of slower writes.',
  'ttl': 'Time to live: how long a cached value, a DNS record or a message stays valid before it expires.',
  'rate limiting': 'Capping how many requests a client may make in a period, to protect a service from overload and abuse. Excess requests usually get HTTP 429.',
  'token bucket': 'A rate-limiting algorithm. A bucket refills with tokens at a steady rate up to a maximum; each request spends a token. It allows short bursts but enforces an average rate.',
  'sliding window': 'A rate-limiting method that counts requests over the last N seconds at any moment, avoiding the burst a fixed window allows at its boundary.',
  'trace context': 'Standard HTTP headers (traceparent, tracestate) that carry a trace id across services, so every log line and timing span for one user action can be joined together.',
  'jwt': 'JSON Web Token: a compact, signed JSON document (header.payload.signature). The server can verify it with a key, without a database lookup. It is signed, not encrypted: anyone can read its contents.',
  'jwks': 'JSON Web Key Set: a public URL where an identity provider publishes the public keys that verify its tokens. The `kid` in a token header says which key to use.',
  'fanout': 'Sending one message to many recipients or one write to many places. "Fan-out on write" does it when the message is created; "fan-out on read" does it when someone reads.',
  'quiet hours': 'A period the user chose (say 22:00 to 07:00 in their time zone) when non-urgent notifications are held back and sent afterwards.',
  'circuit breaker': 'A guard around calls to a dependency. After too many failures it "opens" and fails fast for a while instead of waiting on timeouts, then lets a few test calls through to see if the dependency recovered.',
  'head-of-line blocking': 'When the first item in a queue is stuck, everything behind it waits even if it could have been processed.',
  'cursor pagination': 'Paging with an opaque pointer to the last item seen ("after id 812") instead of a page number. Stable when new items arrive and fast on large tables.',
  'p99': 'The 99th percentile latency: 99% of requests are faster than this. It describes the slow tail that averages hide.',
  'sharding': 'Splitting data across several databases (shards) by a key, so each holds only part of the data and load.',
  'replication': 'Keeping copies of the same data on several machines, for availability and to spread reads.',
  'read replica': 'A copy of the primary database that receives its changes and serves reads. Usually a little behind the primary (replication lag).',
  'replication lag': 'The delay between a write on the primary and its appearance on a replica. Reading from a replica right after writing can show old data.',
  'consistent hashing': 'A way to map keys to servers on a ring so that adding or removing a server moves only a small fraction of the keys, instead of nearly all of them.',
  'eventual consistency': 'If no new writes happen, all copies of the data eventually agree. Reads in the meantime may be stale.',
  'strong consistency': 'Every read sees the latest committed write, as if there were a single copy of the data.',
  'quorum': 'The minimum number of replicas that must take part in a read or write. With N copies, choosing W + R > N guarantees a read overlaps the latest write.',
  'base62': 'Writing a number with 62 symbols (0-9, a-z, A-Z). Seven Base62 characters can represent about 3.5 trillion values.',
  'cdn': 'Content delivery network: servers in many cities that cache your static files and media close to users, so they load fast and your origin serves less.',
  'origin': 'Your own server or bucket behind a CDN. The CDN fetches from the origin on a cache miss.',
  'presigned url': 'A time-limited URL signed with your cloud credentials that lets a client upload or download one specific object directly, without your server in the data path.',
  'websocket': 'A protocol that upgrades an HTTP connection into a long-lived, two-way channel, so the server can push messages to the client at any time.',
  'sse': 'Server-Sent Events: a long-lived HTTP response where the server streams text events to the browser. One direction only (server to client), reconnects automatically.',
  'long polling': 'The client makes a request that the server holds open until there is news or a timeout, then the client immediately asks again.',
  'pub/sub': 'Publish/subscribe: senders publish messages to a topic; every subscriber of that topic receives them. Senders don\'t know who the receivers are.',
  'oauth 2.0': 'A framework that lets an app get limited access to a user\'s account on another service (an access token) without ever seeing the user\'s password.',
  'pkce': 'Proof Key for Code Exchange: the client invents a secret (code verifier), sends its hash at the start of an OAuth flow, and the raw secret at the end, proving the same client finished what it started.',
  'oidc': 'OpenID Connect: an identity layer on top of OAuth 2.0. It adds the ID token, a signed JWT that says who the user is.',
  'refresh token': 'A long-lived credential used only to obtain new short-lived access tokens, so users stay signed in without long-lived access tokens.',
  'csrf': 'Cross-site request forgery: another site tricks the browser into sending a request to your site with the user\'s cookies. Prevented with SameSite cookies, CSRF tokens, or the OAuth state parameter.',
  'httponly cookie': 'A cookie that JavaScript cannot read. It protects session tokens from being stolen by injected scripts (XSS).',
  'hmac': 'A hash-based message authentication code: a signature made with a shared secret. Anyone with the secret can check that the message was not altered.',
  'bloom filter': 'A compact bit array that answers "definitely not seen" or "probably seen". It never gives false negatives, only rare false positives.',
  'inverted index': 'A map from each word to the list of documents that contain it. The core data structure of full-text search.',
  'trie': 'A prefix tree: each path from the root spells a prefix, so all words sharing a prefix share a branch. Natural for autocomplete.',
  'geohash': 'A way to encode a latitude/longitude into a short string where nearby places share a prefix, which makes "nearby" queries prefix lookups.',
  'saga': 'A long business transaction split into local steps across services, where each step has a compensating action that undoes it if a later step fails.',
  'two-phase commit': 'A protocol where a coordinator asks all participants to prepare, then tells all to commit. Atomic across systems, but blocking if the coordinator fails.',
  'double-entry ledger': 'Bookkeeping where every movement of money is recorded as equal debits and credits in two or more accounts, so the books always balance.',
  'optimistic locking': 'Read a row with its version number, and update it only if the version is unchanged (`WHERE version = 7`). If someone else changed it, retry. No locks are held while the user thinks.',
  'pessimistic locking': 'Lock the row when you read it (`SELECT ... FOR UPDATE`), so nobody else can change it until you commit.',
  'leader election': 'A way for a group of nodes to agree that exactly one of them is in charge at a time, and to pick a new one if it fails.',
  'raft': 'A consensus algorithm: an elected leader appends commands to a replicated log, and a command is committed once a majority of nodes have stored it.',
  'write-ahead log': 'A file where every change is appended before it is applied, so after a crash the database can replay the log and recover. Often shortened to WAL.',
  'lsm tree': 'Log-structured merge tree: writes go to an in-memory table and are flushed to sorted files that are merged in the background. Very fast writes; used by Cassandra, RocksDB, ScyllaDB.',
  'backpressure': 'A way for a slow consumer to tell producers to slow down, instead of being overwhelmed or dropping data.',
  'hot partition': 'A partition or shard that receives far more traffic than the others, usually because one key (a celebrity, a viral item) is very popular.',
  'thundering herd': 'Many clients doing the same expensive thing at the same moment, for example all rebuilding the same expired cache entry.',
  'cache stampede': 'A popular cache entry expires and many requests miss at once and all hit the database together. A form of thundering herd.',
  'load balancer': 'A component that spreads incoming requests over several servers and stops sending to servers that fail health checks.',
  'health check': 'A periodic request (for example GET /healthz) that tells a load balancer or orchestrator whether an instance can take traffic.',
  'anycast': 'Announcing the same IP address from many locations, so the network routes each user to the nearest one.',
  'tls': 'Transport Layer Security: encrypts and authenticates a connection. The S in HTTPS.',
  'object storage': 'Storage for whole files (objects) addressed by a key in a bucket, like Amazon S3. Cheap, durable and huge, but not a file system and not for small frequent updates.',
  'multipart upload': 'Uploading a large file as many parts in parallel, each retryable on its own, then asking the store to assemble them.',
  'hls': 'HTTP Live Streaming: video is cut into short segments in several qualities, listed in playlists. The player switches quality as bandwidth changes.',
  'adaptive bitrate': 'Streaming where the player picks the video quality segment by segment based on the current network speed.',
  'transcoding': 'Converting a media file into other formats, resolutions or bitrates.',
  'crdt': 'Conflict-free replicated data type: a data structure that copies can edit independently and always merge to the same result, with no central coordination.',
  'operational transformation': 'A technique for collaborative editing that transforms concurrent edits against each other so every client converges to the same document. Used by Google Docs.',
  'vector clock': 'A list of counters, one per node, attached to data so the system can tell whether two versions are ordered or concurrent.',
  'snowflake id': 'A 64-bit id made of a timestamp, a machine id and a sequence number. Unique without coordination and roughly sorted by time.',
  'uuid': 'A 128-bit identifier. Version 4 is random; version 7 starts with a timestamp, so it sorts by creation time and indexes better.',
  'service discovery': 'How a service finds the current addresses of another service as instances come and go, through a registry or DNS.',
  'mtls': 'Mutual TLS: both sides of a connection present certificates, so the server also knows which service is calling.',
  'sidecar': 'A helper process deployed next to each service instance (for example a proxy in a service mesh) that handles networking concerns for it.',
  'feature flag': 'A switch that turns code paths on or off at run time, per user or percentage, without a new deploy.',
  'canary release': 'Rolling a new version out to a small share of traffic first and watching its metrics before rolling it out to everyone.',
  'blue-green deployment': 'Running the old (blue) and new (green) versions side by side and switching traffic from one to the other at once, with instant rollback.',

'use client';
import { useRef, useState } from 'react';

export function CommentBox({ postId }: { postId: string }) {
  const [text, setText] = useState('');
  // One key per submit attempt, reused if we retry the same submit.
  const keyRef = useRef<string | null>(null);

  async function submit() {
    keyRef.current ??= crypto.randomUUID();
    const res = await fetchWithRetry('/api/v1/posts/' + postId + '/comments', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Idempotency-Key': keyRef.current,
      },
      body: JSON.stringify({ text, client_ts: new Date().toISOString() }),
    });
    if (res.ok) { keyRef.current = null; setText(''); }
  }
  return <form action={submit}><textarea value={text} onChange={e => setText(e.target.value)} /></form>;
}

async function fetchWithRetry(url: string, init: RequestInit, tries = 3): Promise<Response> {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(url, init);
      if (r.status < 500 || i === tries - 1) return r;   // only retry server errors
    } catch (e) { if (i === tries - 1) throw e; }        // network error: retry
    await new Promise(ok => setTimeout(ok, 2 ** i * 300 + Math.random() * 200));
  }
}` }

import jwt                      # PyJWT
from jwt import PyJWKClient
from fastapi import Depends, HTTPException, Request

jwks = PyJWKClient("https://auth.example.com/.well-known/jwks.json")  # caches keys

def current_user(request: Request) -> str:
    auth = request.headers.get("authorization", "")
    if not auth.startswith("Bearer "):
        raise HTTPException(401, "missing token")
    token = auth.removeprefix("Bearer ")
    try:
        key = jwks.get_signing_key_from_jwt(token).key   # picked by the 'kid' header
        claims = jwt.decode(token, key, algorithms=["RS256"],
                            audience="api.example.com",
                            issuer="https://auth.example.com/")
    except jwt.PyJWTError:
        raise HTTPException(401, "invalid token")
    return claims["sub"]` },

@router.post("/v1/posts/{post_id}/comments", status_code=201)
async def create_comment(post_id: str, body: CommentIn,
                         user_id: str = Depends(current_user),
                         idem_key: str = Header(alias="Idempotency-Key"),
                         db: AsyncSession = Depends(get_db)):
    async with db.begin():                         # one transaction
        existing = await db.scalar(select(Comment).where(
            Comment.author_id == user_id, Comment.idempotency_key == idem_key))
        if existing:
            return CommentOut.model_validate(existing)   # replay, no new event

        post = await db.get(Post, post_id) or raise_404()
        comment = Comment(id=new_id("c"), post_id=post_id, author_id=user_id,
                          text=body.text, idempotency_key=idem_key)
        db.add(comment)
        db.add(Outbox(
            event_id=new_id("evt"), aggregate_type="post", aggregate_id=post_id,
            event_type="comment.created",
            payload={"comment_id": comment.id, "post_id": post_id,
                     "post_owner_id": post.owner_id, "actor_id": user_id,
                     "preview": body.text[:120]},
        ))
    return CommentOut.model_validate(comment)` }

from datetime import datetime, time, timedelta
from zoneinfo import ZoneInfo

def plan_channels(tpl, prefs, now_utc: datetime) -> list[dict]:
    plans = []
    tz = ZoneInfo(prefs["tz"])
    for ch in tpl.channels:                          # e.g. ["push", "email", "in_app"]
        setting = prefs.get(f"{ch}.{tpl.category}", "on")
        if setting == "off":
            continue
        send_at = now_utc
        if setting == "digest_daily":
            send_at = next_local_time(now_utc, tz, time(19, 0))
        elif ch == "push" and tpl.priority != "high" and in_quiet_hours(now_utc, tz, prefs):
            send_at = quiet_hours_end(now_utc, tz, prefs)
        plans.append({"channel": ch, "send_at": send_at, "mode": setting})
    return plans

def next_local_time(now_utc, tz, t):
    local = now_utc.astimezone(tz)
    target = local.replace(hour=t.hour, minute=t.minute, second=0, microsecond=0)
    if target <= local:
        target += timedelta(days=1)
    return target.astimezone(ZoneInfo("UTC"))` }

import random

RETRY = {429, 500, 502, 503, 504}
DEAD_TOKEN_REASONS = {"Unregistered", "BadDeviceToken", "DeviceTokenNotForTopic"}
MAX_ATTEMPTS = 6

async def handle_result(job, device, resp):
    if resp.status_code == 200:
        return "sent"
    reason = resp.json().get("reason", "") if resp.content else ""
    if resp.status_code == 410 or reason in DEAD_TOKEN_REASONS:
        await db.execute("DELETE FROM device_tokens WHERE token=$1", device.token)
        return "dead_token"
    if resp.status_code in RETRY and job.attempt + 1 < MAX_ATTEMPTS:
        # "full jitter": random delay up to an exponentially growing cap
        delay = random.uniform(0, min(300, 2 ** job.attempt))
        await requeue(job | {"attempt": job.attempt + 1}, delay_s=delay)
        return "retrying"
    await dead_letter(job, reason=f"{resp.status_code} {reason}")
    return "failed"` }

CREATE TABLE outbox (                                  -- in the Comments DB
  id            BIGSERIAL PRIMARY KEY,
  event_id      TEXT UNIQUE NOT NULL,
  aggregate_type TEXT NOT NULL,
  aggregate_id  TEXT NOT NULL,
  event_type    TEXT NOT NULL,
  payload       JSONB NOT NULL,
  created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
  published_at  TIMESTAMPTZ
);
CREATE INDEX outbox_unpublished ON outbox (id) WHERE published_at IS NULL;

CREATE TABLE notifications (                           -- Notification DB
  id            TEXT PRIMARY KEY,
  event_id      TEXT NOT NULL,
  recipient_id  TEXT NOT NULL,
  category      TEXT NOT NULL,
  template      TEXT NOT NULL,
  title         TEXT NOT NULL,
  body          TEXT NOT NULL,
  deep_link     TEXT,
  read_at       TIMESTAMPTZ,
  created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
  UNIQUE (event_id, recipient_id)                      -- the real dedupe guarantee
);
CREATE INDEX inbox ON notifications (recipient_id, created_at DESC);

CREATE TABLE deliveries (
  id              TEXT NOT NULL,
  notification_id TEXT NOT NULL,
  channel         TEXT NOT NULL CHECK (channel IN ('push','email','sms','in_app')),
  status          TEXT NOT NULL,                        -- scheduled|queued|sent|delivered|failed
  send_at         TIMESTAMPTZ NOT NULL,
  attempts        INT NOT NULL DEFAULT 0,
  provider_ids    JSONB,
  last_error      TEXT,
  created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (id, created_at)
) PARTITION BY RANGE (created_at);                      -- one partition per day
CREATE INDEX due ON deliveries (send_at) WHERE status = 'scheduled';

CREATE TABLE device_tokens (
  token        TEXT PRIMARY KEY,
  user_id      TEXT NOT NULL,
  platform     TEXT NOT NULL,                           -- ios | android | web
  app_version  TEXT,
  last_seen_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
CREATE INDEX ON device_tokens (user_id);

CREATE TABLE notification_prefs (
  user_id TEXT NOT NULL,
  key     TEXT NOT NULL,                                -- 'push.comments', 'quiet_hours', 'tz'
  value   TEXT NOT NULL,
  PRIMARY KEY (user_id, key)
);`,

MAX_ATTEMPTS = 5
BACKOFF_S = [60, 300, 1800, 7200, 21600]

def route_failure(msg, err):
    attempt = int(header(msg, "attempt", "0")) + 1
    topic = "orders.emails.retry" if attempt < MAX_ATTEMPTS else "orders.emails.dlq"
    not_before = time.time() + BACKOFF_S[min(attempt - 1, len(BACKOFF_S) - 1)] * random.uniform(0.8, 1.2)

import base64, hashlib, hmac, json, time

def sign(secret: str, msg_id: str, body: bytes, ts: int | None = None) -> dict:
    ts = ts or int(time.time())
    key = base64.b64decode(secret.removeprefix("whsec_"))
    to_sign = f"{msg_id}.{ts}.".encode() + body
    sig = base64.b64encode(hmac.new(key, to_sign, hashlib.sha256).digest()).decode()
    return {"webhook-id": msg_id, "webhook-timestamp": str(ts),
            "webhook-signature": f"v1,{sig}"}

from croniter import croniter

def next_run_utc(cron: str, tz: str, after_utc: datetime) -> datetime:

const b64url = (b: Buffer) => b.toString('base64url');

async def current_user(sid: str | None = Cookie(default=None), r: Redis = Depends(get_redis)):
    if not sid:
        raise HTTPException(401)
    sess = await r.hgetall(f"sess:{sid}")
    if not sess:
        raise HTTPException(401)
    await r.expire(f"sess:{sid}", 1_209_600)      # sliding expiry
    return sess["user_id"]

@router.post("/v1/sessions/logout-all")
async def logout_all(user_id=Depends(current_user), r=Depends(get_redis)):
    keys = await r.smembers(f"user_sessions:{user_id}")
    if keys:
        await r.delete(*keys, f"user_sessions:{user_id}")` }]

@router.post("/auth/refresh")
async def refresh(rt: str | None = Cookie(default=None), db=Depends(get_db)):
    if not rt:
        raise HTTPException(401)
    h = sha256_hex(rt)
    async with db.transaction():
        row = await db.fetchrow("""UPDATE refresh_tokens SET used_at = now()
            WHERE token_hash=$1 AND used_at IS NULL AND revoked_at IS NULL AND expires_at > now()
            RETURNING family_id, user_id""", h)
        if row is None:
            old = await db.fetchrow("SELECT family_id, used_at FROM refresh_tokens WHERE token_hash=$1", h)
            if old and old["used_at"]:                    # reuse of a rotated token
                await db.execute("UPDATE refresh_tokens SET revoked_at=now() WHERE family_id=$1",
                                 old["family_id"])
                await deny_session(old["family_id"])      # optional: reject its access tokens too
            raise HTTPException(401)
        new_rt = "rt_" + secrets.token_urlsafe(32)
        await db.execute("INSERT INTO refresh_tokens (token_hash, family_id, user_id, expires_at) "
                         "VALUES ($1,$2,$3, now() + interval '30 days')",
                         sha256_hex(new_rt), row["family_id"], row["user_id"])
    resp = JSONResponse({"access_token": mint_access(row["user_id"], row["family_id"]), "expires_in": 600})

local t = redis.call('TIME')

TOKEN_BUCKET = redis.register_script(open("token_bucket.lua").read())

@app.middleware("http")
async def rate_limit(request: Request, call_next):
    ident, rule = identify(request), RULES.lookup(request)        # in-memory config
    key = f"rl:{{{ident}}}:{rule.group}"
    try:
        allowed, remaining, retry = await TOKEN_BUCKET(keys=[key],
            args=[rule.capacity, rule.refill_per_sec, 1])
    except RedisError:
        if rule.fail_closed:                                       # e.g. login, OTP
            return JSONResponse({"error": "try again"}, status_code=503)
        return await call_next(request)                            # fail open
    headers = {"RateLimit-Policy": f'"{rule.group}";q={rule.capacity};w=60',
               "RateLimit": f'"{rule.group}";r={remaining};t={math.ceil(float(retry))}'}
    if not allowed:
        headers["Retry-After"] = str(math.ceil(float(retry)))
        return JSONResponse({"error": "rate_limited"}, status_code=429, headers=headers)
    response = await call_next(request)

import threading, time

EPOCH_MS = 1704067200000          # 2024-01-01

class Snowflake:
    def __init__(self, machine_id: int):
        assert 0 <= machine_id < 1024
        self.machine_id, self.seq, self.last = machine_id, 0, -1
        self.lock = threading.Lock()

    def next_id(self) -> int:
        with self.lock:
            now = int(time.time() * 1000)
            if now < self.last:                      # clock moved backwards
                raise RuntimeError("clock skew, refusing to issue ids")
            if now == self.last:
                self.seq = (self.seq + 1) & 0xFFF
                if self.seq == 0:                    # 4096 used this ms
                    while now <= self.last:
                        now = int(time.time() * 1000)
            else:
                self.seq = 0
            self.last = now
            return ((now - EPOCH_MS) << 22) | (self.machine_id << 12) | self.seq` }],

ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

def base62(n: int, width: int = 7) -> str:
    s = []
    while n:
        n, r = divmod(n, 62)
        s.append(ALPHABET[r])
    return "".join(reversed(s)).rjust(width, "0")

/* ---------- code highlighting ---------- */
const KW = {
  python: 'def class return if elif else for while in not and or is None True False import from as with async await try except finally raise lambda yield pass break continue assert del',
  ts: 'const let var function return if else for while of in new class extends import from export default async await try catch finally throw typeof interface type enum implements null undefined true false this switch case break continue as',
  sql: 'select from where insert into values update set delete create table index unique primary key references not null default on conflict do nothing returning join left inner group by order limit for skip locked and or as begin commit in is with case when then else end text bigint int integer timestamptz jsonb uuid boolean now interval bigserial serial check alter add desc asc exists using partition over smallint numeric char varchar date gin btree concurrently if replace function language trigger',
  redis: 'set get incr incrby expire hset hget hgetall hincrby zadd zrange zrevrange zincrby zrem zrangebyscore zcard zscore xadd xreadgroup xack xautoclaim eval evalsha publish subscribe del ex nx px exat multi exec lpush rpush brpop lrange sadd srem smembers sismember pexpire ttl geoadd geosearch scard exists setnx incrbyfloat',
  bash: 'curl export echo if then fi for do done',
  yaml: 'true false null',
  http: ''
};
KW.tsx = KW.ts; KW.js = KW.ts;
const COMMENT = { python: '#', bash: '#', yaml: '#', redis: '#', ts: '//', tsx: '//', js: '//', sql: '--', http: null, json: null };
function highlight(src, lang) {
  lang = lang || 'text';
  const kws = new Set((KW[lang] || '').split(' ').filter(Boolean));
  const ci = lang === 'sql' || lang === 'redis';
  const cm = COMMENT[lang];
  const parts = [];
  if (cm) parts.push('(' + cm.replace(/[/]/g, '\\/') + '[^\\n]*)'); else parts.push('(\\u0000NEVER)');
  parts.push('("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\')');
  parts.push('(@[\\w.]+)');
  parts.push('(\\b\\d+(?:\\.\\d+)?\\b)');
  parts.push('([A-Za-z_][\\w]*)(?=\\s*\\()');
  parts.push('([A-Za-z_][\\w-]*)');
  const re = new RegExp(parts.join('|'), 'g');
  let out = '', last = 0, m;
  if (lang === 'text' || lang === 'json') return esc(src);
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const t = m[0];
    if (m[1]) out += '<span class="c">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(t) + '</span>';
    else if (m[3] && lang !== 'sql') out += '<span class="de">' + esc(t) + '</span>';
    else if (m[4]) out += '<span class="nu">' + esc(t) + '</span>';
    else if (m[5]) out += kws.has(ci ? t.toLowerCase() : t) ? '<span class="kw">' + esc(t) + '</span>' : '<span class="fn">' + esc(t) + '</span>';
    else if (m[6]) out += kws.has(ci ? t.toLowerCase() : t) ? '<span class="kw">' + esc(t) + '</span>' : esc(t);
    else out += esc(t);
  }
  return out + esc(src.slice(last));
}

/* ---------- JSON payload with automatic diff against the previous step ---------- */
function flatten(v, p, out) {
  out = out || {};
  if (v && typeof v === 'object') {
    const ks = Array.isArray(v) ? v.map((_, i) => i) : Object.keys(v);
    if (!ks.length) out[p] = JSON.stringify(v);
    ks.forEach(k => flatten(v[k], p === '' ? String(k) : p + '.' + k, out));
  } else out[p] = JSON.stringify(v);
  return out;
}
function fmtVal(v) {
  if (typeof v === 'string') return '<span class="s">' + esc(JSON.stringify(v)) + '</span>';
  if (typeof v === 'number') return '<span class="n">' + v + '</span>';
  return '<span class="b">' + esc(JSON.stringify(v)) + '</span>';
}
function renderJSON(val, prev, fields) {
  const pf = prev ? flatten(prev, '') : null;
  const pkeys = pf ? Object.keys(pf) : [];
  const fx = fields || {};
  const lines = [];
  const status = (path, leaf, v) => {
    if (!pf) return '';
    if (leaf) { if (!(path in pf)) return 'add'; return pf[path] !== JSON.stringify(v) ? 'chg' : ''; }
    return pkeys.some(k => k === path || k.startsWith(path + '.')) ? '' : 'add';
  };
  const fieldFor = (path, key) => fx[path] != null ? path : (key != null && fx[key] != null ? String(key) : null);
  function walk(v, key, path, depth, last) {
    const ind = '  '.repeat(depth);
    const kh = (key === null || typeof key === 'number') ? '' : '<span class="k">' + esc(JSON.stringify(key)) + '</span>: ';
    const comma = last ? '' : ',';
    const f = key === null ? null : fieldFor(path, typeof key === 'number' ? null : key);
    const push = (st, html) => lines.push({ st, html, f });
    if (v && typeof v === 'object') {
      const arr = Array.isArray(v), ents = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
      const st = path === '' ? '' : status(path, false);
      if (!ents.length) { push(st, ind + kh + (arr ? '[]' : '{}') + comma); return; }
      push(st, ind + kh + (arr ? '[' : '{'));
      ents.forEach(([k, x], i) => walk(x, arr ? i : k, path === '' ? String(k) : path + '.' + k, depth + 1, i === ents.length - 1));
      lines.push({ st, html: ind + (arr ? ']' : '}') + comma, f: null });
    } else push(status(path, true, v), ind + kh + fmtVal(v) + comma);
  }
  walk(val, null, '', 0, true);
  let removed = [];
  if (pf) {
    const cur = flatten(val, '');
    const ckeys = Object.keys(cur);
    const exists = p => ckeys.some(k => k === p || k.startsWith(p + '.'));
    const set = new Set();
    pkeys.filter(k => !(k in cur)).forEach(k => {
      const segs = k.split('.'); let p = '';
      for (let i = 0; i < segs.length; i++) { p = i ? p + '.' + segs[i] : segs[i]; if (!exists(p)) { set.add(p); break; } }
    });
    removed = Array.from(set);
  }
  const html = lines.map(l => {
    const mark = l.st === 'add' ? '+' : l.st === 'chg' ? '~' : '';
    const cls = 'ln' + (l.st ? ' ' + l.st : '') + (l.f ? ' fx' : '');
    return '<span class="' + cls + '"' + (l.f ? ' data-field="' + esc(l.f) + '"' : '') + '><i>' + mark + '</i>' + l.html + '</span>';
  }).join('');
  const counts = { add: lines.filter(l => l.st === 'add' && l.f !== undefined).length, chg: lines.filter(l => l.st === 'chg').length };
  return { html, removed, counts };
}

/* ---------- tiny architecture thumbnail for the home cards ---------- */
function thumb(f) {

  const pos = n => [pad + (n.x + .5) * (W - 2 * pad) / g.cols, 12 + (n.y + .5) * (H - 24) / g.rows];
  const pairs = new Map();
  f.steps.forEach(s => { if (s.from !== s.to) { const k = [s.from, s.to].sort().join('|'); pairs.set(k, s); } });
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  pairs.forEach((s, k) => {
    const [a, b] = k.split('|').map(id => f.nodes.find(n => n.id === id));
    if (!a || !b) return; const [x1, y1] = pos(a), [x2, y2] = pos(b);
    svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--rule2)" stroke-width="1.5"/>';
  });

  return svg + '</svg>';
}

      f.refs.map(r => '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.label) + '</a>' + (r.note ? ' <span>' + esc(r.note) + '</span>' : '') + '</li>').join('') + '</ol></section>';
  }
  h += '<div class="sd-bar" id="bar"><button id="mPrev" aria-label="Previous step">' + UI.prev + 'Back</button><span class="mid" id="mCount"></span><button id="mNext" aria-label="Next step">Next' + UI.next + '</button></div>';
  app.innerHTML = h;

  // events
  $('#bPrev').onclick = () => go(S.i - 1, true);
  $('#bNext').onclick = () => go(S.i + 1, true);
  $('#mPrev').onclick = () => go(S.i - 1, true, true);
  $('#mNext').onclick = () => go(S.i + 1, true, true);
  $('#bRestart').onclick = () => { setPlaying(false); go(0, true); };
  $('#bPlay').onclick = () => setPlaying(!S.playing);
  $('#speed').oninput = e => { S.speed = parseFloat(e.target.value); if (S.playing) { setPlaying(false); setPlaying(true); } };
  $('#dots').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i, true); };
  $('#steplist').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { go(+b.dataset.i, true); $('#sec-sim').scrollIntoView({ behavior: 'smooth' }); } };
  $('#cv').addEventListener('click', e => { const n = e.target.closest('.sd-node'); if (n) showNode(n.dataset.node); });
  $$('.sd-jump a').forEach(a => a.onclick = e => { e.preventDefault(); const t = $('#sec-' + a.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth' }); });
  const cs = $('[data-copy=schema]'); if (cs) cs.onclick = () => copyText(f.schema.trim(), cs);
  swipe($('#panel')); swipe($('#dg'));
  layout();
  go(start, false);
}

function swipe(el) {
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 === null) return; const t = e.changedTouches[0]; const dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (e.target.closest('pre')) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(S.i + (dx < 0 ? 1 : -1), true);
  }, { passive: true });
}

/* layout: positions nodes on a grid; transposes on narrow screens so wide diagrams become tall */
let L = null;
function layout() {
  if (!S) return;
  const f = S.f, cv = $('#cv'); if (!cv) return;
  const W = cv.clientWidth;
  const narrow = W < 560 && f.grid.cols > f.grid.rows;
  const cols = narrow ? f.grid.rows : f.grid.cols, rows = narrow ? f.grid.cols : f.grid.rows;
  const rowH = W < 560 ? 104 : 134;
  const H = rows * rowH;
  cv.style.height = H + 'px';
  const colW = W / cols;
  const nw = Math.max(70, Math.min(W < 560 ? 100 : 150, colW * (W < 560 ? 0.78 : 0.68)));
  const P = {};
  f.nodes.forEach(n => {
    const gx = narrow ? n.y : n.x, gy = narrow ? n.x : n.y;
    const x = (gx + .5) * colW, y = (gy + .5) * rowH;
    const el = cv.querySelector('[data-node="' + n.id + '"]');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.setProperty('--nw', nw + 'px');
    P[n.id] = { x, y, el };
  });
  f.nodes.forEach(n => { const p = P[n.id]; p.w = p.el.offsetWidth; p.h = p.el.offsetHeight; });
  L = { W, H, P };
  drawWires();
}

function edgeGeom(a, b, off) {
  const A = L.P[a], B = L.P[b];
  let dx = B.x - A.x, dy = B.y - A.y; const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len * off, ny = dx / len * off;
  const clip = (P, tx, ty) => { const ddx = tx, ddy = ty; const sx = (P.w / 2 + 7) / Math.abs(ddx || 1e-9), sy = (P.h / 2 + 7) / Math.abs(ddy || 1e-9); const s = Math.min(sx, sy); return [P.x + ddx * s, P.y + ddy * s]; };
  const [x1, y1] = clip(A, dx, dy); const [x2, y2] = clip(B, -dx, -dy);
  return { x1: x1 + nx, y1: y1 + ny, x2: x2 + nx, y2: y2 + ny };
}
function drawWires() {
  if (!S || !L) return;
  const f = S.f, svg = $('#wires'); if (!svg) return;
  svg.setAttribute('viewBox', '0 0 ' + L.W + ' ' + L.H);
  const dirs = new Set(f.steps.filter(s => s.from !== s.to).map(s => s.from + '>' + s.to));
  const offFor = s => dirs.has(s.to + '>' + s.from) ? 4.5 : 0;
  const seen = new Set(f.steps.slice(0, S.i).map(s => s.from + '>' + s.to));
  let out = '';
  const done = new Set();
  f.steps.forEach(s => {
    if (s.from === s.to) return; const k = s.from + '>' + s.to; if (done.has(k)) return; done.add(k);
    const g = edgeGeom(s.from, s.to, offFor(s));
    out += '<line class="sd-wire' + (seen.has(k) ? ' past' : '') + '" x1="' + g.x1 + '" y1="' + g.y1 + '" x2="' + g.x2 + '" y2="' + g.y2 + '"/>';
  });
  const s = f.steps[S.i];
  $$('.sd-wlabel,.sd-busychip', $('#cv')).forEach(x => x.remove());
  if (s.from !== s.to) {
    const g = edgeGeom(s.from, s.to, offFor(s));
    const col = kc(f.nodes.find(n => n.id === s.from).kind);
    const ang = Math.atan2(g.y2 - g.y1, g.x2 - g.x1), ah = 9;
    const p1 = [g.x2 - ah * Math.cos(ang - .45), g.y2 - ah * Math.sin(ang - .45)], p2 = [g.x2 - ah * Math.cos(ang + .45), g.y2 - ah * Math.sin(ang + .45)];
    out += '<line class="sd-wire active' + (s.async ? ' async' : '') + (s.reply ? ' reply' : '') + '" style="stroke:' + col + '" x1="' + g.x1 + '" y1="' + g.y1 + '" x2="' + g.x2 + '" y2="' + g.y2 + '"/>' +
      '<path d="M' + g.x2 + ',' + g.y2 + 'L' + p1[0] + ',' + p1[1] + 'L' + p2[0] + ',' + p2[1] + 'z" style="fill:' + col + '"/>' +
      '<circle id="pk" class="sd-packet" r="6" cx="' + g.x1 + '" cy="' + g.y1 + '" style="fill:' + col + ';color:' + col + '"/>';
    svg.innerHTML = out;
    const lab = document.createElement('div');
    lab.className = 'sd-wlabel'; lab.style.color = col;
    lab.style.left = ((g.x1 + g.x2) / 2) + 'px'; lab.style.top = ((g.y1 + g.y2) / 2) + 'px';
    lab.innerHTML = '<b><span>' + (S.i + 1) + '</span></b>' + esc(s.label || s.title);
    $('#cv').appendChild(lab);
    // if the label doesn't fit in the free gap between the two boxes, show only the step number
    const free = Math.hypot(g.x2 - g.x1, g.y2 - g.y1);
    const horizontal = Math.abs(g.x2 - g.x1) >= Math.abs(g.y2 - g.y1);
    if ((horizontal ? lab.offsetWidth : lab.offsetHeight) > free - 10) { lab.classList.add('badge'); lab.innerHTML = '<b><span>' + (S.i + 1) + '</span></b>'; lab.title = s.label || s.title; }
    animatePacket(g);
  } else {
    svg.innerHTML = out;
    const n = f.nodes.find(x => x.id === s.from), P = L.P[s.from];
    const chip = document.createElement('div');
    chip.className = 'sd-busychip'; chip.style.color = kc(n.kind);
    const below = P.y + P.h / 2 + 30 < L.H;
    chip.style.left = P.x + 'px'; chip.style.top = (below ? P.y + P.h / 2 + 8 : P.y - P.h / 2 - 30) + 'px';
    chip.textContent = (S.i + 1) + ' · ' + (s.label || s.title);
    $('#cv').appendChild(chip);
    cancelAnimationFrame(S.raf);
  }
}
function animatePacket(g) {
  cancelAnimationFrame(S.raf);
  const pk = $('#pk'); if (!pk) return;
  if (reduceMotion) { pk.setAttribute('cx', g.x2); pk.setAttribute('cy', g.y2); return; }
  const dur = 1300 / S.speed, rest = 500 / S.speed; let t0 = null;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const tick = ts => {
    if (t0 === null) t0 = ts; const e = (ts - t0) % (dur + rest); const t = ease(Math.min(1, e / dur));
    pk.setAttribute('cx', g.x1 + (g.x2 - g.x1) * t); pk.setAttribute('cy', g.y1 + (g.y2 - g.y1) * t);
    pk.setAttribute('opacity', e > dur ? Math.max(0, 1 - (e - dur) / rest) : 1);
    S.raf = requestAnimationFrame(tick);
  };
  S.raf = requestAnimationFrame(tick);
}

function go(i, user, fromBar) {
  const f = S.f; if (i < 0 || i >= f.steps.length) { if (S.playing && i >= f.steps.length) setPlaying(false); return; }
  S.i = i; markSeen(f.id, i);
  const s = f.steps[i];
  history.replaceState(null, '', '#/flow/' + f.id + '/' + (i + 1));
  // nodes
  const visited = new Set(); f.steps.slice(0, i + 1).forEach(x => { visited.add(x.from); visited.add(x.to); });
  $$('.sd-node', $('#cv')).forEach(el => {
    const id = el.dataset.node;
    el.classList.toggle('src', id === s.from && s.from !== s.to);
    el.classList.toggle('dst', id === s.to);
    el.classList.toggle('busy', id === s.to);
    el.classList.toggle('dim', !visited.has(id));
  });
  drawWires();
  // caption
  const a = f.nodes.find(n => n.id === s.from), b = f.nodes.find(n => n.id === s.to);
  $('#cap').innerHTML = '<div class="sn"><span>Step ' + (i + 1) + ' of ' + f.steps.length + '</span><span>·</span><span>' + esc(a.label) + (s.from === s.to ? ' (internal)' : ' → ' + esc(b.label)) + '</span>' + (s.async ? '<span class="sd-tag">async</span>' : '') + '</div><h2>' + rich(s.title) + '</h2><p>' + rich(s.caption) + '</p>';
  $('#bPrev').disabled = i === 0; $('#bNext').disabled = i === f.steps.length - 1;
  $('#mPrev').disabled = i === 0; $('#mNext').disabled = i === f.steps.length - 1;
  $('#mCount').textContent = (i + 1) + ' / ' + f.steps.length;
  $$('#dots .sd-dot').forEach((d, k) => { d.classList.toggle('on', k === i); d.classList.toggle('seen', (progress[f.id] || []).includes(k)); });
  $$('#steplist li').forEach((li, k) => li.classList.toggle('on', k === i));
  $('.sd-progressbar').style.width = ((i + 1) / f.steps.length * 100) + '%';
  renderTabs();
  $('#ninfo').classList.remove('show');
  if (user && fromBar) {
    const st = $('.sd-stage'); const top = st.getBoundingClientRect().top;
    if (top < 0) window.scrollTo({ top: window.scrollY + top - 60, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
}

function renderTabs() {
  const f = S.f, s = f.steps[S.i];
  const codes = s.code ? (Array.isArray(s.code) ? s.code : [s.code]) : [];
  const tabs = [['explain', 'What happens']];
  if (s.payload !== undefined) tabs.push(['payload', 'Payload']);
  if (codes.length) tabs.push(['code', 'Code', codes.length]);
  if (s.failure) tabs.push(['failure', 'When it fails']);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'explain';
  $('#tabs').innerHTML = tabs.map(t => '<button class="sd-tab' + (t[0] === S.tab ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[2] > 1 ? ' <span class="ct">' + t[2] + '</span>' : '') + '</button>').join('');
  $('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; renderTabs(); };
  let h = '';
  if (S.tab === 'explain') {
    h += '<h3>What happens</h3>' + paras(s.text || s.caption);
    if (s.details) h += '<h3>Under the hood</h3><ul class="sd-list">' + s.details.map(d => '<li>' + rich(d) + '</li>').join('') + '</ul>';
    const tn = f.nodes.find(n => n.id === s.to);
    if (tn.desc) h += '<h3>About ' + esc(tn.label) + '</h3><p>' + rich(tn.desc) + '</p>';
  } else if (S.tab === 'payload') {
    h += payloadHTML(s);
  } else if (S.tab === 'code') {
    h += codes.map((c, k) => '<div class="sd-codeblock"><div class="sd-codehead"><span class="sd-lang ' + esc(c.lang) + '">' + esc(c.lang) + '</span><span class="sd-codetitle">' + esc(c.title || '') + '</span><button class="sd-copy" data-ci="' + k + '">Copy</button></div>' +
      (c.note ? '<p class="sd-note" style="margin:0 0 8px">' + rich(c.note) + '</p>' : '') + '<pre class="sd-code"><code>' + highlight(c.src.replace(/^\n+|\s+$/g, ''), c.lang) + '</code></pre></div>').join('') +
      '<p class="sd-illus">Illustrative code: focused on this step, with imports and error handling trimmed. Library APIs change, so check the docs linked under References.</p>';
  } else if (S.tab === 'failure') {
    h += '<div class="sd-fail">' + paras(s.failure) + '</div>';
  }
  $('#tabbody').innerHTML = h;
  $$('#tabbody [data-ci]').forEach(b => b.onclick = () => copyText(codes[+b.dataset.ci].src.trim(), b));
  $$('#tabbody .ln.fx').forEach(l => l.onclick = e => { const k = l.dataset.field; popover(l, k, (s.fields || {})[k]); e.stopPropagation(); });
}
function payloadHTML(s) {
  const f = S.f;
  let h = '';
  let prev = null;
  if (s.diff !== false) {
    for (let k = S.i - 1; k >= 0; k--) { const p = f.steps[k].payload; if (p !== undefined) { prev = p; break; } }
    if (prev && (typeof prev !== 'object' || typeof s.payload !== 'object')) prev = null;
    if (prev) { // only diff when the two payloads are recognisably the same message
      const pf = flatten(prev, ''), cf = Object.keys(flatten(s.payload, ''));
      const shared = cf.filter(k => k in pf).length;
      if (shared / Math.max(1, cf.length) < 0.35) prev = null;
    }
  }
  h += '<div class="sd-plhead"><span class="sd-plkind">' + esc(s.payloadKind || (typeof s.payload === 'string' ? 'Message' : 'JSON')) + '</span>';
  if (typeof s.payload === 'object' && prev) h += '<span class="sd-diffkey"><span><i class="sd-json" style="background:var(--add-bg);color:var(--add-ink);border:0;padding:0">+</i>added</span><span><i style="background:var(--chg-bg);color:var(--chg-ink)">~</i>changed</span></span>';
  else if (typeof s.payload === 'object') h += '<span class="sd-diffkey">new message shape</span>';
  h += '</div>';
  if (typeof s.payload === 'string') {
    h += '<pre class="sd-code"><code>' + highlight(s.payload.replace(/^\n+|\s+$/g, ''), s.payloadLang || 'http') + '</code></pre>';
  } else {
    const r = renderJSON(s.payload, prev, s.fields);
    h += '<pre class="sd-json">' + r.html + '</pre>';
    if (r.removed.length) h += '<div class="sd-removed">Dropped at this hop: ' + r.removed.map(x => '<s>' + esc(x) + '</s>').join(', ') + '</div>';
  }
  if (s.fields) h += '<h3>Fields that matter here</h3><dl class="sd-fields">' + Object.keys(s.fields).map(k => '<dt>' + esc(k) + '</dt><dd>' + rich(s.fields[k]) + '</dd>').join('') + '</dl>';
  h += '<p class="sd-illus">Illustrative payload: real systems name and shape these differently.</p>';
  return h;
}

function showNode(id) {
  const f = S.f, n = f.nodes.find(x => x.id === id), box = $('#ninfo');
  const idx = f.steps.map((s, i) => (s.from === id || s.to === id) ? i : -1).filter(i => i >= 0);
  box.style.setProperty('--kc', kc(n.kind));
  box.innerHTML = '<b>' + esc(n.label) + '</b> <span class="sd-tag" style="font:11px var(--mono)">' + esc(KIND_LABEL[n.kind] || n.kind) + (n.sub ? ' · ' + esc(n.sub) : '') + '</span><div style="margin-top:4px">' + rich(n.desc || '') + '</div>' +
    (idx.length ? '<div class="lk">' + idx.map(i => '<button class="sd-dot' + (i === S.i ? ' on' : '') + '" data-i="' + i + '" title="' + esc(f.steps[i].title) + '">' + (i + 1) + '</button>').join('') + '</div>' : '');
  box.classList.add('show');
  box.onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i, true); };
  const el = $('#cv [data-node="' + id + '"]'); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 900);
}

function setPlaying(on) {
  S.playing = on; clearInterval(S.timer);
  $('#bPlay').innerHTML = on ? UI.pause : UI.play; $('#bPlay').setAttribute('aria-label', on ? 'Pause' : 'Play');
  if (on) { if (S.i >= S.f.steps.length - 1) go(0, true); S.timer = setInterval(() => go(S.i + 1, true), 4200 / S.speed); }
}
function stopAll() { if (S) { clearInterval(S.timer); cancelAnimationFrame(S.raf); } }

/* ---------- glossary & edit pages ---------- */
function termUsage() {
  const use = {};
  FLOWS.forEach(f => { const blob = JSON.stringify(f).toLowerCase(); Object.keys(GLOSSARY).forEach(t => { if (blob.includes('{{' + t)) (use[t] = use[t] || []).push(f); }); });
  return use;
}
function renderGlossary() {
  currentFlow = null; setNav('glossary'); document.title = 'Glossary · System Design Flows'; $('.sd-progressbar').style.width = '0';
  const use = termUsage();
  const terms = Object.keys(GLOSSARY).sort();
  app.innerHTML = '<div class="sd-prose"><div class="sd-eyebrow">Glossary</div><h1>The words, explained plainly</h1><p>' + terms.length + ' terms used across the flows. Underlined words inside a flow open these definitions.</p>' +
    '<label class="sd-search" style="margin-top:14px">' + UI.search + '<input id="gq" type="search" placeholder="Search terms" autocomplete="off"></label><div class="sd-gl" id="gl"></div></div>';
  const draw = q => {
    q = (q || '').toLowerCase();
    $('#gl').innerHTML = terms.filter(t => !q || t.includes(q) || GLOSSARY[t].toLowerCase().includes(q)).map(t =>
      '<div class="sd-box" id="t-' + esc(t.replace(/\W+/g, '-')) + '"><b>' + esc(t.charAt(0).toUpperCase() + t.slice(1)) + '</b><p>' + esc(GLOSSARY[t]) + '</p>' +
      (use[t] ? '<small>Used in: ' + use[t].map(f => '<a href="#/flow/' + f.id + '">' + esc(f.title) + '</a>').join(', ') + '</small>' : '') + '</div>').join('');
  };
  draw(''); $('#gq').oninput = e => draw(e.target.value);
}
function renderEdit() {
  currentFlow = null; setNav('edit'); document.title = 'Edit and host · System Design Flows'; $('.sd-progressbar').style.width = '0';
  app.innerHTML = $('#edit-guide').innerHTML;
  $$('#app pre code[data-lang]').forEach(c => { c.innerHTML = highlight(c.textContent, c.dataset.lang); });
}

/* ---------- popover, copy, theme ---------- */
const pop = document.createElement('div'); pop.className = 'sd-pop'; document.body.appendChild(pop);
function popover(anchor, title, body) {
  if (!body) return;
  pop.innerHTML = '<b>' + esc(title) + '</b>' + rich(body);
  pop.classList.add('show');
  const r = anchor.getBoundingClientRect(), pw = Math.min(340, window.innerWidth - 20);
  pop.style.maxWidth = pw + 'px';
  let left = Math.min(Math.max(10, r.left), window.innerWidth - pw - 10);
  pop.style.left = left + 'px';
  const below = r.bottom + 10 + pop.offsetHeight < window.innerHeight;
  pop.style.top = (below ? r.bottom + 8 : r.top - pop.offsetHeight - 8) + 'px';
}
document.addEventListener('click', e => {
  const t = e.target.closest('.sd-term');
  if (t) { popover(t, t.textContent, GLOSSARY[t.dataset.term]); e.stopPropagation(); return; }
  const n = e.target.closest('.sd-n');
  if (n && S) { showNode(n.dataset.node); const dg = $('#dg'); if (dg && dg.getBoundingClientRect().bottom < 0) dg.scrollIntoView({ behavior: 'smooth' }); return; }
  if (!e.target.closest('.sd-pop')) pop.classList.remove('show');
});
window.addEventListener('scroll', () => pop.classList.remove('show'), { passive: true });
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done); else done();
}
document.addEventListener('keydown', e => {
  if (!S || !$('#cv') || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') { go(S.i + 1, true); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(S.i - 1, true); e.preventDefault(); }
  else if (e.key === ' ' && !e.target.closest('button')) { setPlaying(!S.playing); e.preventDefault(); }
});
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
$('#themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('sdflows:theme', r.dataset.theme); } catch (e) {}
  if (S && $('#cv')) drawWires();
};
try { const t = localStorage.getItem('sdflows:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

window.addEventListener('hashchange', () => { const cur = location.hash; if (S && $('#cv') && cur.startsWith('#/flow/' + S.f.id + '/')) { const n = parseInt(cur.split('/')[3], 10) - 1; if (n !== S.i && n >= 0) go(n, false); return; } route(); });
window.SD_APP = { go: i => go(i, true), state: () => S, flows: FLOWS };
route();
})();
